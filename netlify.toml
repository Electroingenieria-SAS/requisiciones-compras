# ============================================================
# CONFIGURACIÓN NETLIFY
# Electroingeniería S.A.S. - Sistema de Requisiciones
# ============================================================

[build]
  publish = "."

# Headers de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
