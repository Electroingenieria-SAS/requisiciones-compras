<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Requisiciones | Electroingeniería S.A.S.</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/requisiciones.css">
</head>
<body>

    <!-- ─── HEADER ─── -->
    <header class="app-header">
        <div class="header-izquierda">
            <img src="/assets/logo-header.png" alt="Electroingeniería" style="height:40px;border-radius:4px;">
        </div>
        <div class="header-centro">
            REQUISICIONES DE COMPRAS ADMINISTRATIVAS
        </div>
        <div class="header-derecha">
            <div class="header-info">
                <div class="header-info-codigo">S-TF-39 v1</div>
                <div class="header-info-proceso" id="header-proceso">-</div>
            </div>
            <button class="btn-logout" id="btn-logout">Cerrar sesión</button>
        </div>
    </header>

    <!-- ─── NAVEGACIÓN ─── -->
    <nav class="nav-bar">
        <div class="nav-links">
            <a href="/dashboard.html" class="nav-link activo">Dashboard</a>
            <a href="/requisiciones.html" class="nav-link">Requisiciones</a>
            <a href="/admin.html" class="nav-link oculto" id="nav-admin">Administración</a>
        </div>
    </nav>

    <!-- ─── CONTENIDO PRINCIPAL ─── -->
    <main class="contenido-principal" id="contenido-principal" style="display:none;">

        <!-- Tarjetas de métricas -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem;">
            <div style="background: white; border-radius: var(--radio-lg); padding: 1.5rem; box-shadow: var(--sombra-sm); border: 1px solid var(--color-borde);">
                <div style="font-size: var(--texto-sm); color: var(--color-texto-secundario); margin-bottom: 0.5rem;">Total Requisiciones</div>
                <div style="font-size: var(--texto-3xl); font-weight: 700; color: var(--color-azul);" id="metrica-total">0</div>
            </div>
            <div style="background: white; border-radius: var(--radio-lg); padding: 1.5rem; box-shadow: var(--sombra-sm); border: 1px solid var(--color-borde); border-left: 4px solid var(--color-pendiente);">
                <div style="font-size: var(--texto-sm); color: var(--color-texto-secundario); margin-bottom: 0.5rem;">Pendientes</div>
                <div style="font-size: var(--texto-3xl); font-weight: 700; color: var(--color-pendiente);" id="metrica-pendientes">0</div>
            </div>
            <div style="background: white; border-radius: var(--radio-lg); padding: 1.5rem; box-shadow: var(--sombra-sm); border: 1px solid var(--color-borde); border-left: 4px solid var(--color-en-proceso);">
                <div style="font-size: var(--texto-sm); color: var(--color-texto-secundario); margin-bottom: 0.5rem;">En Proceso</div>
                <div style="font-size: var(--texto-3xl); font-weight: 700; color: var(--color-en-proceso);" id="metrica-en-proceso">0</div>
            </div>
            <div style="background: white; border-radius: var(--radio-lg); padding: 1.5rem; box-shadow: var(--sombra-sm); border: 1px solid var(--color-borde); border-left: 4px solid var(--color-cumplido);">
                <div style="font-size: var(--texto-sm); color: var(--color-texto-secundario); margin-bottom: 0.5rem;">Cumplidas</div>
                <div style="font-size: var(--texto-3xl); font-weight: 700; color: var(--color-cumplido);" id="metrica-cumplidas">0</div>
            </div>
            <div style="background: white; border-radius: var(--radio-lg); padding: 1.5rem; box-shadow: var(--sombra-sm); border: 1px solid var(--color-borde);">
                <div style="font-size: var(--texto-sm); color: var(--color-texto-secundario); margin-bottom: 0.5rem;">Tiempo promedio cumplimiento</div>
                <div style="font-size: var(--texto-2xl); font-weight: 700; color: var(--color-texto);" id="metrica-promedio">- días</div>
            </div>
        </div>

        <!-- Info del usuario -->
        <div style="background: white; border-radius: var(--radio-lg); padding: 1.5rem; box-shadow: var(--sombra-sm); border: 1px solid var(--color-borde);">
            <div style="display: flex; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid var(--color-gris-light);">
                <span style="font-weight: 500; color: var(--color-texto-secundario);">Usuario</span>
                <span style="font-weight: 600;" id="info-nombre">-</span>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid var(--color-gris-light);">
                <span style="font-weight: 500; color: var(--color-texto-secundario);">Proceso</span>
                <span style="font-weight: 600;" id="info-proceso">-</span>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid var(--color-gris-light);">
                <span style="font-weight: 500; color: var(--color-texto-secundario);">Rol</span>
                <span id="info-rol">-</span>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 0.75rem 0;">
                <span style="font-weight: 500; color: var(--color-texto-secundario);">Correo</span>
                <span style="font-weight: 600;" id="info-email">-</span>
            </div>
        </div>
    </main>

    <!-- JavaScript -->
    <script type="module">
        import { protegerRuta, cerrarSesion, esAdministrador } from '/js/services/auth.service.js';
        import { obtenerEstadisticas } from '/js/services/requisiciones.service.js';
        import { Loader } from '/js/components/loader.js';

        async function inicializar() {
            Loader.mostrar('Cargando dashboard...');

            const { usuario, perfil } = await protegerRuta();
            if (!usuario || !perfil) return;

            // Header
            document.getElementById('header-proceso').textContent = perfil.proceso;

            // Info usuario
            document.getElementById('info-nombre').textContent = perfil.nombre_completo;
            document.getElementById('info-proceso').textContent = perfil.proceso;
            document.getElementById('info-email').textContent = usuario.email;

            const rolTexto = esAdministrador(perfil) ? 'Administrador' : 'Usuario';
            const rolClase = esAdministrador(perfil) ? 'badge-admin' : 'badge-usuario';
            document.getElementById('info-rol').innerHTML = `<span class="badge-estado ${rolClase}">${rolTexto}</span>`;

            // Mostrar link de admin si es administrador
            if (esAdministrador(perfil)) {
                document.getElementById('nav-admin').classList.remove('oculto');
            }

            // Cargar métricas
            const stats = await obtenerEstadisticas();
            if (stats) {
                document.getElementById('metrica-total').textContent = stats.total || 0;
                document.getElementById('metrica-pendientes').textContent = stats.pendientes || 0;
                document.getElementById('metrica-en-proceso').textContent = stats.en_proceso || 0;
                document.getElementById('metrica-cumplidas').textContent = stats.cumplidas || 0;
                document.getElementById('metrica-promedio').textContent =
                    stats.tiempo_promedio_cumplimiento_dias
                        ? `${stats.tiempo_promedio_cumplimiento_dias} días`
                        : '- días';
            }

            document.getElementById('contenido-principal').style.display = 'block';
            Loader.ocultar();
        }

        document.getElementById('btn-logout').addEventListener('click', async () => {
            Loader.mostrar('Cerrando sesión...');
            await cerrarSesion();
        });

        document.addEventListener('DOMContentLoaded', inicializar);
    </script>

</body>
</html>
